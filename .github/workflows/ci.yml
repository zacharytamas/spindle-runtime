name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node 22.19.0
            node: 22.19.0
            check: pnpm check
            platform: node
          - runtime: node 24
            node: "24"
            check: pnpm check
            platform: node
          - runtime: bun 1.4.5
            node: 22.19.0
            bun: 1.4.5
            check: bun --bun run check
            platform: bun
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: matrix.bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check }}
      - run: pnpm build
      - run: ${{ matrix.platform }} packages/runtime/dist/cli/main.js --version | tee /dev/stderr | grep -q "platform ${{ matrix.platform }}"

  requirements:
    name: requirements match the pinned spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - run: node scripts/spec-requirements.mjs --refresh --check
